<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ShowUp</title>
<meta name="description" content="Página de retorno do ShowUp." />
<meta name="theme-color" content="#4C97C1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="ShowUp" />
<meta property="og:locale" content="pt_BR" />
<meta property="og:title" content="ShowUp" />
<meta property="og:description" content="Página de retorno do ShowUp." />
<meta property="og:image" content="https://showup-509120.web.app/og.png" />
<style>
  :root {
    --bg: #F7F6F2; --ink: #1A1C1A; --brand: #2F7BA6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111517; --ink: #ECEFEE; --brand: #6DB1D6; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; text-align: center;
    padding: 24px; padding-top: env(safe-area-inset-top, 24px); padding-bottom: env(safe-area-inset-bottom, 24px);
  }
  .spinner {
    width: 28px; height: 28px; border: 3px solid rgba(52,89,64,0.25); border-top-color: var(--brand);
    border-radius: 50%; margin: 0 auto 18px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 15px; margin: 0 0 18px; }
  a.fallback {
    display: inline-block; background: var(--brand); color: #fff; text-decoration: none;
    padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <div>
    <img src="/logo.png" alt="ShowUp" width="70" height="56" style="height:56px;width:auto;margin-bottom:18px">
    <div class="spinner"></div>
    <p>Voltando pro app…</p>
    <a class="fallback hidden" id="fallbackLink" href="#">Toque aqui se não voltar sozinho</a>
  </div>

<script>
(function () {
  // Só repassa pra o NOSSO esquema de deep link — nunca redireciona pra
  // qualquer URL arbitrária vinda da query string, pra não virar um
  // "open redirect" que alguém poderia usar de forma maliciosa.
  const ALLOWED_SCHEME = "showup://";
  const params = new URLSearchParams(window.location.search);
  let next = params.get("next") || "showup:///(app)/perfil";

  if (!next.startsWith(ALLOWED_SCHEME)) {
    document.querySelector("p").textContent = "Link inválido.";
    return;
  }

  const link = document.getElementById("fallbackLink");
  link.href = next;

  window.location.href = next;

  // Se depois de um tempinho o navegador ainda estiver aqui (o redirect
  // automático pode falhar em alguns navegadores/WebViews), mostra o
  // botão de fallback pra abrir manualmente.
  setTimeout(function () {
    link.classList.remove("hidden");
  }, 1200);
})();
</script>
</body>
</html>
