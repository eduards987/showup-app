<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Página não encontrada — ShowUp</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#4C97C1" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  :root { --bg:#F7F6F2; --ink:#1A1C1A; --ink-soft:#5A5E5B; --brand-dark:#2A6F98; --line:#E5E3DF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111517; --ink:#ECEFEE; --ink-soft:#A7B1B4; --brand-dark:#8CC4E4; --line:#2B363B; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink);
         font-family: Inter, system-ui, sans-serif; padding: 24px; text-align:center; }
  .box { max-width: 420px; }
  .logo { height: 70px; width: auto; margin-bottom: 20px; }
  h1 { font-family: Georgia, serif; font-size: 30px; margin: 0 0 10px; }
  p { color: var(--ink-soft); margin: 0 0 24px; line-height:1.55; }
  a.btn { display:inline-block; background:var(--brand-dark); color:var(--bg); text-decoration:none; font-weight:600; padding:12px 24px; border-radius:12px; }
</style>
</head>
<body>
  <main class="box">
    <img class="logo" src="/logo.png" alt="ShowUp" width="88" height="70">
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe. Se você recebeu um link de agendamento, peça ao profissional para enviá-lo de novo.</p>
    <a class="btn" href="/">Ir para o início</a>
  </main>
</body>
</html>
