[pytest]
# Fixados 2 workers do xdist (determinístico). loadscope fixa cada classe/
# módulo de teste num único worker — as suítes compartilham um backend e
# assumem estado sequencial compartilhado dentro de cada classe — então
# paraleliza entre classes/módulos sem gerar corrida DENTRO da mesma classe.
# Não mude addopts sem entender essa premissa: mantenha -n 2 --dist loadscope.
# Serial = `-n 0` (NÃO `-p no:xdist`, que dá erro porque addopts ainda passa
# -n/--dist). Uma opção `-n` própria no seu setup de pytest colide com a do
# xdist — renomeie a sua.
required_plugins = pytest-xdist
addopts = -n 2 --dist loadscope
